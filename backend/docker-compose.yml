services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    container_name: starter-kit-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - starter-kit

  web:
    image: nginx:alpine
    container_name: starter-kit-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - starter-kit

  db:
    image: postgres:17-alpine
    container_name: starter-kit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - starter-kit-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - starter-kit

  mailhog:
    image: mailhog/mailhog
    container_name: starter-kit-mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - starter-kit

  adminer:
    image: adminer
    container_name: starter-kit-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - starter-kit

networks:
  starter-kit:
    driver: bridge

volumes:
  starter-kit-db:
